apiVersion: v1
kind: Namespace
metadata:
  name: llm-d-sc-scaleout
  labels:
    purpose: isolated-scaleout-benchmark
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: scaleout-boundary
  namespace: llm-d-sc-scaleout
spec:
  hard:
    pods: "60"
    persistentvolumeclaims: "1"
    requests.cpu: "60"
    requests.memory: 120Gi
    limits.cpu: "240"
    limits.memory: 240Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: classifier-model
  namespace: llm-d-sc-scaleout
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-storage
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: classifier-target
  namespace: llm-d-sc-scaleout
spec:
  selector:
    app.kubernetes.io/name: llm-d-sc-scaleout
    app.kubernetes.io/component: classifier-target
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: classifier-target
  namespace: llm-d-sc-scaleout
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-d-sc-scaleout
      app.kubernetes.io/component: classifier-target
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-d-sc-scaleout
        app.kubernetes.io/component: classifier-target
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [gnr2.fm2aihpcsed.com, rhgnr1]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: llm-d-sc-scaleout
              app.kubernetes.io/component: classifier-target
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: llm-d-sc
          image: image-registry.openshift-image-registry.svc:5000/llm-d-sc-gremlins/llm-d-sc-gremlin@sha256:04323612ce3f73873b4c3ed6e09264e828241537e2c1a4231b43f32e9744d5aa
          imagePullPolicy: IfNotPresent
          env:
            - {name: LLM_D_SC_MODEL_DIR, value: /models}
            - {name: LLM_D_SC_CLASSIFIER, value: complexity}
            - {name: LLM_D_SC_LISTEN, value: "0.0.0.0:50051"}
            - {name: LLM_D_SC_INFERENCE_WORKERS, value: "4"}
            - {name: LLM_D_SC_METRICS_LOG_SECS, value: "10"}
          ports:
            - {name: grpc, containerPort: 50051}
          readinessProbe:
            tcpSocket: {port: grpc}
            initialDelaySeconds: 3
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            tcpSocket: {port: grpc}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 1
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "4", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: classifier-model}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scaleout-isolation
  namespace: llm-d-sc-scaleout
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
