apiVersion: batch/v1
kind: Job
metadata:
  name: upstream-connection-isolation-1
  namespace: llm-d-sc-gremlins
  labels:
    app.kubernetes.io/name: llm-d-sc-gremlin
    app.kubernetes.io/component: benchmark-driver
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-d-sc-gremlin
        app.kubernetes.io/component: benchmark-driver
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: gnr2.fm2aihpcsed.com
      containers:
        - name: connection-driver
          image: image-registry.openshift-image-registry.svc:5000/llm-d-sc-gremlins/llm-d-sc-gremlin@sha256:37377f46ae5f408607fc31a8ccf1aead27b61a8a338d2eeeeda015e914a9e87a
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              target=classifier-target.llm-d-sc-gremlins.svc:50051
              for concurrency in 64 256; do
                for connections in 1 4 16 64; do
                  echo "GREMLIN_CELL_BEGIN concurrency=${concurrency} connections=${connections}"
                  /usr/local/bin/llm-d-sc-connection-probe --target "${target}" --topology arena-gnr2-upstream-fixed-connections --context-bytes 256 --concurrency "${concurrency}" --connections "${connections}" --requests 1000
                  echo "GREMLIN_CELL_END concurrency=${concurrency} connections=${connections}"
                done
              done
              for connections in 1 4 16; do
                echo "GREMLIN_CELL_BEGIN concurrency=512 connections=${connections}"
                /usr/local/bin/llm-d-sc-connection-probe --target "${target}" --topology arena-gnr2-upstream-fixed-connections --context-bytes 256 --concurrency 512 --connections "${connections}" --requests 2000
                echo "GREMLIN_CELL_END concurrency=512 connections=${connections}"
              done
          resources:
            requests: {cpu: "2", memory: 512Mi}
            limits: {cpu: "8", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
