apiVersion: batch/v1
kind: Job
metadata:
  name: scaleout-channel-distribution-5
  namespace: llm-d-sc-scaleout
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-d-sc-scaleout
        app.kubernetes.io/component: benchmark-driver
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: rhgnr1
      containers:
        - name: driver
          image: image-registry.openshift-image-registry.svc:5000/llm-d-sc-gremlins/llm-d-sc-gremlin@sha256:37377f46ae5f408607fc31a8ccf1aead27b61a8a338d2eeeeda015e914a9e87a
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/llm-d-sc-connection-probe"]
          args:
            - --target
            - classifier-target.llm-d-sc-scaleout.svc:50051
            - --topology
            - arena-rhgnr1-scaleout-5
            - --context-bytes
            - "256"
            - --concurrency
            - "100"
            - --connections
            - "100"
            - --requests
            - "1000000"
          resources:
            requests: {cpu: "2", memory: 512Mi}
            limits: {cpu: "8", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
