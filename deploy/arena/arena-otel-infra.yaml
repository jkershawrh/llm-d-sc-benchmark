apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-d-sc-otel
  namespace: llm-d-sc-scaleout
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: llm-d-sc-otel-arena
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/stats", "nodes/proxy", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: llm-d-sc-otel-arena
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: llm-d-sc-otel-arena
subjects:
  - kind: ServiceAccount
    name: llm-d-sc-otel
    namespace: llm-d-sc-scaleout
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-d-sc-otel
  namespace: llm-d-sc-scaleout
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
      kubeletstats:
        collection_interval: 5s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_IP}:10250
        insecure_skip_verify: true
        metric_groups: [node, pod, container]
        extra_metadata_labels: [container.id]

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
        spike_limit_mib: 48
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.node.name
          labels:
            - tag_name: app.component
              key: app.kubernetes.io/component
              from: pod
      batch:
        timeout: 2s
        send_batch_size: 1024

    exporters:
      prometheus:
        endpoint: 0.0.0.0:9464
        resource_to_telemetry_conversion:
          enabled: true
      debug:
        verbosity: basic
        sampling_initial: 2
        sampling_thereafter: 200

    service:
      pipelines:
        metrics:
          receivers: [kubeletstats]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [prometheus, debug]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: llm-d-sc-otel
  namespace: llm-d-sc-scaleout
  labels:
    app.kubernetes.io/name: llm-d-sc-otel
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-d-sc-otel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-d-sc-otel
        app.kubernetes.io/component: benchmark-telemetry
    spec:
      serviceAccountName: llm-d-sc-otel
      nodeSelector:
        node-role.kubernetes.io/worker-cpu-tuned: ""
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: collector
          image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.157.0
          args: ["--config=/conf/collector.yaml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            - name: K8S_NODE_IP
              valueFrom:
                fieldRef: {fieldPath: status.hostIP}
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: metrics, containerPort: 9464}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
      volumes:
        - name: config
          configMap: {name: llm-d-sc-otel}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-d-sc-otel
  namespace: llm-d-sc-scaleout
  labels:
    app.kubernetes.io/name: llm-d-sc-otel
spec:
  selector:
    app.kubernetes.io/name: llm-d-sc-otel
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: metrics, port: 9464, targetPort: metrics}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm-d-sc-otel
  namespace: llm-d-sc-scaleout
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-d-sc-otel
  endpoints:
    - port: metrics
      interval: 5s
      scrapeTimeout: 4s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otel-scrape
  namespace: llm-d-sc-scaleout
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: llm-d-sc-otel
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 9464}
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 9464}
