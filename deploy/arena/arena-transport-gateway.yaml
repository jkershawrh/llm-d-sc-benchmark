apiVersion: v1
kind: Service
metadata:
  name: classifier-transport-target
  namespace: llm-d-sc-scaleout
  labels:
    benchmark.llm-d/component: transport-target
spec:
  selector:
    benchmark.llm-d/component: transport-target
  ports:
    - {name: grpc, port: 50051, targetPort: grpc}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: classifier-transport-target
  namespace: llm-d-sc-scaleout
  labels:
    benchmark.llm-d/component: transport-target
spec:
  replicas: 5
  selector:
    matchLabels:
      benchmark.llm-d/component: transport-target
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  template:
    metadata:
      labels:
        benchmark.llm-d/component: transport-target
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [gnr2.fm2aihpcsed.com, rhgnr1]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              benchmark.llm-d/component: transport-target
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: llm-d-sc
          image: image-registry.openshift-image-registry.svc:5000/llm-d-sc-gremlins/llm-d-sc-gremlin@sha256:04323612ce3f73873b4c3ed6e09264e828241537e2c1a4231b43f32e9744d5aa
          imagePullPolicy: IfNotPresent
          env:
            - {name: LLM_D_SC_MODEL_DIR, value: /models}
            - {name: LLM_D_SC_CLASSIFIER, value: complexity}
            - {name: LLM_D_SC_LISTEN, value: "0.0.0.0:50051"}
            - {name: LLM_D_SC_INFERENCE_WORKERS, value: "4"}
          ports:
            - {name: grpc, containerPort: 50051}
          readinessProbe:
            tcpSocket: {port: grpc}
            initialDelaySeconds: 3
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            tcpSocket: {port: grpc}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 1
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "4", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: classifier-model}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: classifier-transport-gateway
  namespace: llm-d-sc-scaleout
  labels:
    benchmark.llm-d/component: transport-gateway
  annotations:
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: istio
  listeners:
    - name: grpc
      protocol: HTTP
      port: 50051
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: classifier-transport-gateway
  namespace: llm-d-sc-scaleout
  labels:
    benchmark.llm-d/component: transport-gateway
spec:
  parentRefs:
    - name: classifier-transport-gateway
      sectionName: grpc
  rules:
    - backendRefs:
        - name: classifier-transport-target
          port: 50051
