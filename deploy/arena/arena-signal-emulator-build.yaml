apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: llm-d-sc-signal-emulator
  namespace: llm-d-sc-gremlins
  labels:
    app.kubernetes.io/name: llm-d-sc-signal-emulator
    app.kubernetes.io/component: benchmark-driver
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: llm-d-sc-signal-emulator
  namespace: llm-d-sc-gremlins
  labels:
    app.kubernetes.io/name: llm-d-sc-signal-emulator
    app.kubernetes.io/component: benchmark-driver
spec:
  runPolicy: SerialLatestOnly
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile.signal-emulator
      buildArgs:
        - name: LLM_D_SC_BENCHMARK_REVISION
          value: local-review-cgroup-cpu-20260901
  output:
    to:
      kind: ImageStreamTag
      name: llm-d-sc-signal-emulator:latest
  resources:
    requests: {cpu: "2", memory: 2Gi}
    limits: {cpu: "8", memory: 8Gi}
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3
  triggers: []
