[package]
name = "llm-d-sc-signal-emulator"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Independent semantic-classifier signal and transport benchmark driver"

[[bin]]
name = "llm-d-sc-signal-emulator"
path = "src/main.rs"

[dependencies]
prost = "0.14"
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tonic = "0.14"
tonic-prost = "0.14"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
